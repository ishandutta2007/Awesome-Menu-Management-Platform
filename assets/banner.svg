<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Glowing Animated Orbs / Background Elements (Positioned behind text) -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="120" fill="#8b5cf6">
      <animate attributeName="cy" values="80;120;80" dur="6s" repeatCount="indefinite" />
      <animate attributeName="r" values="120;140;120" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="220" r="150" fill="#f43f5e">
      <animate attributeName="cy" values="220;180;220" dur="8s" repeatCount="indefinite" />
      <animate attributeName="r" values="150;130;150" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="250" r="100" fill="#06b6d4">
      <animate attributeName="cx" values="600;650;600" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Decorative Tech Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="900" y1="0" x2="900" y2="300" />
  </g>

  <!-- Animated Glowing Top Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent-grad)" />

  <!-- Foreground Content (Text & Icons - Fully Visible above background) -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Icon / Badge -->
    <text x="600" y="85" font-size="42" fill="#ffffff">🍽️ 📲 ⚡</text>
    
    <!-- Title -->
    <text x="600" y="150" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="1.5" filter="url(#glow)">
      Awesome Menu Management Platform
    </text>
    
    <!-- Subtitle -->
    <text x="600" y="195" font-size="20" font-weight="400" fill="#cbd5e1" letter-spacing="0.5">
      Curated Ecosystem of SaaS Platforms &amp; Open-Source Digital Menu Solutions
    </text>

    <!-- Taglines / Pills -->
    <g transform="translate(0, 225)">
      <rect x="360" y="0" width="140" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="430" y="20" font-size="13" font-weight="600" fill="#a78bfa">QR &amp; Digital Menus</text>

      <rect x="520" y="0" width="160" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="600" y="20" font-size="13" font-weight="600" fill="#fb7185">Multi-Channel Sync</text>

      <rect x="700" y="0" width="140" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="770" y="20" font-size="13" font-weight="600" fill="#22d3ee">Open-Source POS</text>
    </g>
  </g>
</svg>
